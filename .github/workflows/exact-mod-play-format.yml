name: exact mod-play format
on:
  push:
    branches: [feat/graphics-max-stack]
    paths: [".github/workflows/exact-mod-play-format.yml"]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install clang-format==21.1.8
      - run: |
          clang-format port/game/common/mod_play.cpp > /tmp/mod_play.cpp
          diff -u port/game/common/mod_play.cpp /tmp/mod_play.cpp || true
