name: sidecar format preview
on:
  push:
    branches: [feat/graphics-max-stack]
    paths:
      - ".github/workflows/sidecar-format-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install clang-format==21.1.8
      - name: Exact clang-format diff
        shell: bash
        run: |
          clang-format port/enhanced/viewer/scene_lighting.cpp > /tmp/scene_lighting.cpp
          diff -u port/enhanced/viewer/scene_lighting.cpp /tmp/scene_lighting.cpp || true
