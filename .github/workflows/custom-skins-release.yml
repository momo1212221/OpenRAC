name: Custom Skin Studio release

on:
  push:
    branches:
      - feat/custom-skins
    paths:
      - custom-skins/**
      - openrac-mods.json
      - .github/workflows/custom-skins-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Validate and package the tool mod
        id: package
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile

          root = pathlib.Path("custom-skins")
          manifest = json.loads((root / "openrac-mod.json").read_text())
          assert manifest["format"] == 2
          assert manifest["id"] == "custom-skins"
          assert manifest["type"] == "script"
          assert manifest["api"] == "1.1"
          assert manifest["scripts"] == ["main.luau"]
          assert manifest["tool"]["page"] == "ui/index.html"
          assert (root / "main.luau").is_file()
          assert (root / manifest["tool"]["page"]).is_file()

          version = manifest["version"]
          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          archive = dist / f"custom-skins-{version}.zip"
          files = sorted(p for p in root.rglob("*") if p.is_file())
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in files:
                  info = zipfile.ZipInfo(path.relative_to(root).as_posix(), (1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, path.read_bytes())

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (dist / "SHA256SUMS").write_text(f"{digest}  {archive.name}\n")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          print((dist / "SHA256SUMS").read_text(), end="")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="custom-skins-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" "dist/custom-skins-$VERSION.zip" dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Custom Skin Studio $VERSION" \
            --notes "OpenRAC 1.0.2-compatible Script+Tool packaging. The compatibility script is a no-op; all skin editing/export functionality runs in the sandboxed tool page. Install the ZIP with Mods -> My mods -> File... or use the feat/custom-skins branch URL when GitHub API access works."
