name: Custom Skin Studio release

on:
  push:
    branches:
      - feat/custom-skins
    paths:
      - custom-skins/**
      - openrac-mods.json
      - .github/workflows/custom-skins-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Validate and package the tool mod
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, zipfile

          root = pathlib.Path("custom-skins")
          manifest = json.loads((root / "openrac-mod.json").read_text())
          assert manifest["format"] == 2
          assert manifest["id"] == "custom-skins"
          assert manifest["version"] == "0.1.0"
          assert manifest["tool"]["page"] == "ui/index.html"
          assert (root / manifest["tool"]["page"]).is_file()

          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          platforms = [
              "macos-arm64",
              "macos-x86_64",
              "linux-x86_64",
              "linux-aarch64",
              "windows-x86_64",
              "windows-arm64",
              "android-arm64",
          ]
          base = dist / "custom-skins-0.1.0.zip"
          files = sorted(p for p in root.rglob("*") if p.is_file())
          with zipfile.ZipFile(base, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in files:
                  info = zipfile.ZipInfo(path.relative_to(root).as_posix(), (1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, path.read_bytes())
          for platform in platforms:
              shutil.copyfile(base, dist / f"custom-skins-0.1.0-{platform}.zip")
          base.unlink()

          sums = []
          for path in sorted(dist.glob("*.zip")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              sums.append(f"{digest}  {path.name}")
          (dist / "SHA256SUMS").write_text("\n".join(sums) + "\n")
          print((dist / "SHA256SUMS").read_text(), end="")
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="custom-skins-v0.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" dist/*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Custom Skin Studio 0.1.0" \
            --notes "Install with OpenRAC Mods -> Add a mod using the feat/custom-skins branch URL. Tool-only mod: exports and edits Ratchet skin textures and builds normal OpenRAC data-pack ZIPs."
