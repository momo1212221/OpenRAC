name: Custom Skin Studio release

on:
  push:
    branches:
      - feat/custom-skins
    paths:
      - custom-skins/**
      - .github/workflows/custom-skins-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate browser code
        run: |
          node --check custom-skins/ui/app.js
          node --check custom-skins/ui/bridge.js
          node --check custom-skins/ui/pack.js

      - name: Validate and package the tool mod
        id: package
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile

          root = pathlib.Path("custom-skins")
          manifest = json.loads((root / "openrac-mod.json").read_text())
          assert manifest["format"] == 2
          assert manifest["id"] == "custom-skins"
          assert manifest["type"] == "script"
          assert manifest["api"] == "1.1"
          assert manifest["scripts"] == ["main.luau"]
          assert manifest["tool"]["page"] == "ui/index.html"
          for game in ("rac1", "rac2", "rac3", "rac4", "rac5", "rac6"):
              assert game in manifest["games"]
          assert (root / "main.luau").is_file()
          assert (root / manifest["tool"]["page"]).is_file()

          version = manifest["version"]
          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          archive = dist / f"custom-skins-{version}.zip"
          files = sorted(p for p in root.rglob("*") if p.is_file())
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in files:
                  info = zipfile.ZipInfo(path.relative_to(root).as_posix(), (1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, path.read_bytes())

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (dist / "SHA256SUMS").write_text(f"{digest}  {archive.name}\n")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          print((dist / "SHA256SUMS").read_text(), end="")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="custom-skins-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" "dist/custom-skins-$VERSION.zip" dist/SHA256SUMS             --target "$GITHUB_SHA"             --title "Custom Skin Studio $VERSION"             --notes "Enhanced-graphics-style Skin Studio. Selects OpenRAC games/versions, edits Ratchet class 0 plus exported hero-look variants, and builds standard in-game replacement packs. Direct Apply requires the companion Skin Studio host extension; Export ZIP works on the stock Mod Tool API."
