name: format skin panel

on:
  push:
    branches:
      - feat/custom-skins
    paths:
      - launcher/src/components/SkinPanel.svelte
      - .github/workflows/format-skin.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-skins
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - working-directory: launcher
        run: yarn install --immutable
      - working-directory: launcher
        run: yarn prettier --write src/components/SkinPanel.svelte
      - name: Commit formatting
        run: |
          if git diff --quiet -- launcher/src/components/SkinPanel.svelte; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/src/components/SkinPanel.svelte
          git commit -m "style: format skin workbench panel"
          git push origin HEAD:feat/custom-skins
